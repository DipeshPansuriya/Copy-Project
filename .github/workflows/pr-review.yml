name: Pull Request Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: PR Review Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title convention
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            security
          requireScope: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # These checks must gate the merge.
      - name: Run security audit
        run: |
          chmod +x scripts/security_audit.sh
          ./scripts/security_audit.sh --full

      - name: Check for secrets
        run: python3 scripts/check_secrets.py --push

      - name: Validate Docker build
        run: docker build -t openclipboard:pr-test ./backend

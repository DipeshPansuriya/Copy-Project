name: Pull Request Review

on:
  pull_request:
    branches: [main]

jobs:
  review:
    name: PR Review Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR title convention
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            security
          requireScope: false

      - name: Run security audit
        run: |
          chmod +x scripts/security_audit.sh
          ./scripts/security_audit.sh --full || true

      - name: Check for secrets
        run: |
          python3 scripts/check_secrets.py --push || true

      - name: Validate Docker build
        run: |
          docker build -t openclipboard:pr-test ./backend

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            console.log(`PR #${context.issue.number} has ${reviews.length} review(s)`);

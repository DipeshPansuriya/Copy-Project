name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # daily at 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets bandit safety

      - name: Run detect-secrets baseline scan
        id: detect_secrets
        run: |
          if [ -f .secrets.baseline ]; then
            detect-secrets audit .secrets.baseline || true
          else
            detect-secrets scan --baseline .secrets.baseline . || true
          fi

      - name: Run bandit security linter
        id: bandit
        run: |
          bandit -r backend/app/ -f json -o bandit-report.json || true
          bandit -r backend/app/ || true

      - name: Run safety dependency check
        id: safety
        run: |
          cd backend && safety check --json --output safety-report.json || true
          cd backend && safety check || true

      - name: Run custom secret scanner
        id: custom_secret_scan
        run: |
          python3 scripts/check_secrets.py --push || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            .secrets.baseline
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

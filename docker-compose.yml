# OpenClipboard — open-source cross-device clipboard
#
# Services:
#   app     — FastAPI backend (+ static frontend + admin dashboard)
#   postgres — (optional) PostgreSQL for multi-instance deployments
#   redis     — (optional) shared rate limiting + sessions for multi-instance
#   minio     — (optional) S3-compatible object storage
#
# Default: SQLite + local disk (single instance, zero config).
# Multi-instance: set CLIP_DB_BACKEND=postgres + CLIP_STORAGE=minio.

services:
  app:
    build: ./backend
    container_name: openclipboard-app
    ports:
      - "8000:8000"
    volumes:
      - clip-data:/data
    environment:
      CLIP_STORAGE: local
      CLIP_DB_BACKEND: sqlite
      # Uncomment these for PostgreSQL backend:
      # CLIP_DB_BACKEND: postgres
      # PG_HOST: postgres
      # PG_PORT: 5432
      # PG_USER: openclipboard
      # PG_PASSWORD: openclipboard
      # PG_DATABASE: openclipboard
      CLIP_MAX_UPLOAD_MB: "50"
      CLIP_DEFAULT_TTL: "900"
      CLIP_MIN_TTL: "30"
      CLIP_MAX_TTL: "86400"
      CLIP_PURGE_INTERVAL: "30"

      # Security
      CLIP_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CLIP_CORS_ORIGINS: "*"
      CLIP_RATE_LIMIT_SEND: "20/minute"
      CLIP_RATE_LIMIT_RETRIEVE: "30/minute"
      CLIP_RATE_LIMIT_FILE: "30/minute"
      CLIP_RATE_LIMIT_DELETE: "10/minute"
      CLIP_MAX_FAILED_ATTEMPTS: "5"
      CLIP_LOCKOUT_SECONDS: "300"
      CLIP_PASSWORD_PROTECTION: "true"

      # Admin / monitoring
      CLIP_ADMIN_ENABLED: "true"
      CLIP_ADMIN_USERNAME: "admin"
      CLIP_ADMIN_PASSWORD: "admin"   # ⚠️ change in production!

    restart: unless-stopped

  # Optional: PostgreSQL (multi-instance deployments)
  # Uncomment to use PostgreSQL instead of SQLite:
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: openclipboard-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     POSTGRES_USER: openclipboard
  #     POSTGRES_PASSWORD: openclipboard
  #     POSTGRES_DB: openclipboard
  #   volumes:
  #     - clip-postgres:/var/lib/postgresql/data
  #   restart: unless-stopped

  # Optional: Redis (shared rate limiting + admin sessions for multi-instance)
  # Uncomment for multi-instance deployments:
  # redis:
  #   image: redis:7-alpine
  #   container_name: openclipboard-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - clip-redis:/data
  #   restart: unless-stopped

  # Optional: open-source MinIO object storage (S3-compatible)
  # Uncomment to use MinIO backend:
  # minio:
  #   image: minio/minio:latest
  #   container_name: openclipboard-minio
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin
  #   volumes:
  #     - clip-minio:/data
  #   command: server /data --console-address ":9001"
  #   restart: unless-stopped

volumes:
  clip-data:
  # clip-postgres:
  # clip-redis:
  # clip-minio:
